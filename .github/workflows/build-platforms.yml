name: Build Platform Binaries

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v1.0.710)'
        required: true

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
            arch: x64
            node-arch: x64
            libc: glibc
          - os: ubuntu-latest
            platform: linux
            arch: arm64
            node-arch: arm64
            libc: glibc
          - os: ubuntu-latest
            platform: linux
            arch: x64
            node-arch: x64
            libc: musl
          - os: ubuntu-latest
            platform: linux
            arch: arm64
            node-arch: arm64
            libc: musl
          - os: macos-13
            platform: darwin
            arch: x64
            node-arch: x64
            libc: ''
          - os: macos-latest
            platform: darwin
            arch: arm64
            node-arch: arm64
            libc: ''
          - os: windows-latest
            platform: win32
            arch: x64
            node-arch: x64
            libc: ''
          - os: windows-latest
            platform: win32
            arch: arm64
            node-arch: arm64
            libc: ''

    runs-on: ${{ matrix.os }}
    name: Build ${{ matrix.platform }}-${{ matrix.arch }}${{ matrix.libc == 'musl' && '-musl' || '' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        if: matrix.libc != 'musl'
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Determine tag
        id: tag
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ github.event.inputs.tag }}" >> $GITHUB_OUTPUT
          else
            echo "tag=${{ github.event.release.tag_name }}" >> $GITHUB_OUTPUT
          fi

      - name: Set archive suffix
        id: suffix
        shell: bash
        run: |
          if [ "${{ matrix.libc }}" = "musl" ]; then
            echo "suffix=${{ matrix.platform }}-${{ matrix.arch }}-musl" >> $GITHUB_OUTPUT
          else
            echo "suffix=${{ matrix.platform }}-${{ matrix.arch }}" >> $GITHUB_OUTPUT
          fi

      - name: Build in Alpine container (musl x64)
        if: matrix.libc == 'musl' && matrix.arch == 'x64'
        shell: bash
        run: |
          docker run --rm -v "$PWD":/app -w /app node:lts-alpine sh -c '
            apk add --no-cache python3 make g++ linux-headers
            npm install --ignore-scripts
            npm rebuild better-sqlite3
            npm rebuild onnxruntime-node || true
            npm rebuild node-pty || true
            node scripts/patch-fsbrowse.js
            node scripts/copy-vendor.js
          '

      - name: Build in Alpine container (musl arm64)
        if: matrix.libc == 'musl' && matrix.arch == 'arm64'
        uses: uraimo/run-on-arch-action@v2
        with:
          arch: aarch64
          distro: alpine_latest
          dockerRunArgs: -v "$PWD":/app -w /app
          install: |
            apk add --no-cache nodejs npm python3 make g++ linux-headers
          run: |
            npm install --ignore-scripts
            npm rebuild better-sqlite3
            npm rebuild onnxruntime-node || true
            npm rebuild node-pty || true
            node scripts/patch-fsbrowse.js
            node scripts/copy-vendor.js

      - name: Install dependencies (native x64)
        if: matrix.libc != 'musl' && matrix.arch == 'x64'
        shell: bash
        run: |
          npm install --ignore-scripts
          npm rebuild better-sqlite3
          npm rebuild onnxruntime-node || true
          npm rebuild node-pty || true

      - name: Install dependencies (darwin arm64)
        if: matrix.libc != 'musl' && matrix.platform == 'darwin' && matrix.arch == 'arm64'
        shell: bash
        run: |
          npm install --ignore-scripts
          npm rebuild better-sqlite3
          npm rebuild onnxruntime-node || true
          npm rebuild node-pty || true

      - name: Install dependencies (cross-compile arm64 on linux)
        if: matrix.libc != 'musl' && matrix.platform == 'linux' && matrix.arch == 'arm64'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu
          npm install --ignore-scripts
          npx --yes prebuild-install -r napi --platform linux --arch arm64 -p better-sqlite3 || \
            npm rebuild better-sqlite3 --target_arch=arm64
          npm rebuild onnxruntime-node --target_arch=arm64 || true
          npx --yes prebuild-install -r napi --platform linux --arch arm64 -p node-pty || \
            npm rebuild node-pty --target_arch=arm64 || true

      - name: Install dependencies (cross-compile arm64 on windows)
        if: matrix.libc != 'musl' && matrix.platform == 'win32' && matrix.arch == 'arm64'
        shell: bash
        run: |
          npm install --ignore-scripts
          npx --yes prebuild-install -r napi --platform win32 --arch arm64 -p better-sqlite3 || \
            npm rebuild better-sqlite3 --target_arch=arm64
          npm rebuild onnxruntime-node --target_arch=arm64 || true
          npx --yes prebuild-install -r napi --platform win32 --arch arm64 -p node-pty || \
            npm rebuild node-pty --target_arch=arm64 || true

      - name: Run postinstall scripts
        if: matrix.libc != 'musl'
        shell: bash
        run: |
          node scripts/patch-fsbrowse.js
          node scripts/copy-vendor.js

      - name: Verify native modules
        shell: bash
        run: |
          echo "Checking native module binaries..."
          find node_modules/better-sqlite3 -name "*.node" -type f 2>/dev/null | head -5 || echo "WARN: no better-sqlite3 .node found"
          find node_modules/onnxruntime-node -name "*.node" -o -name "*.so" -o -name "*.dylib" -o -name "*.dll" 2>/dev/null | head -5 || echo "WARN: no onnxruntime-node native found"
          find node_modules/node-pty -name "*.node" -type f 2>/dev/null | head -5 || echo "INFO: node-pty .node not found (optional)"
          echo "Native module check complete."

      - name: Remove dev artifacts
        shell: bash
        run: |
          rm -rf .github .git .code-search .gitignore .npmignore
          rm -rf test/ __tests__/ test-results/ tmp/ dogfood-output/ busybase/
          rm -rf *.log .DS_Store .env* bun.lock
          rm -rf color-table.html test-block.html install.sh
          rm -rf .prd .pma

      - name: Strip unnecessary files from node_modules
        shell: bash
        run: |
          find node_modules -type f \( \
            -name "*.md" -o -name "*.markdown" -o \
            -name "*.ts" -not -name "*.d.ts" -o \
            -name "CHANGELOG*" -o -name "HISTORY*" -o \
            -name ".travis.yml" -o -name ".eslintrc*" -o \
            -name ".prettierrc*" -o -name "tsconfig.json" -o \
            -name "Makefile" -o -name "Gruntfile*" -o \
            -name "*.map" \
          \) -delete 2>/dev/null || true
          find node_modules -type d -name "__tests__" -exec rm -rf {} + 2>/dev/null || true
          find node_modules -type d -name "test" -exec rm -rf {} + 2>/dev/null || true
          find node_modules -type d -name "tests" -exec rm -rf {} + 2>/dev/null || true
          find node_modules -type d -name "docs" -exec rm -rf {} + 2>/dev/null || true
          find node_modules -type d -name "example" -exec rm -rf {} + 2>/dev/null || true
          find node_modules -type d -name "examples" -exec rm -rf {} + 2>/dev/null || true

      - name: Package tarball (unix)
        if: matrix.platform != 'win32'
        shell: bash
        run: |
          VERSION=${{ steps.tag.outputs.tag }}
          ARCHIVE_NAME="agentgui-${VERSION}-${{ steps.suffix.outputs.suffix }}.tar.gz"
          cd ..
          tar czf "$ARCHIVE_NAME" \
            --exclude='*.pma' \
            --exclude='.prd' \
            agentgui/
          mv "$ARCHIVE_NAME" agentgui/
          echo "ARCHIVE_NAME=$ARCHIVE_NAME" >> $GITHUB_ENV

      - name: Package zip (windows)
        if: matrix.platform == 'win32'
        shell: pwsh
        run: |
          $version = "${{ steps.tag.outputs.tag }}"
          $archiveName = "agentgui-$version-${{ steps.suffix.outputs.suffix }}.zip"
          cd ..
          Compress-Archive -Path agentgui/* -DestinationPath "$archiveName" -Force
          Move-Item "$archiveName" agentgui/
          echo "ARCHIVE_NAME=$archiveName" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Generate checksums
        shell: bash
        run: |
          if command -v sha256sum &>/dev/null; then
            sha256sum "$ARCHIVE_NAME" > "$ARCHIVE_NAME.sha256"
          else
            shasum -a 256 "$ARCHIVE_NAME" > "$ARCHIVE_NAME.sha256"
          fi

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          files: |
            ${{ env.ARCHIVE_NAME }}
            ${{ env.ARCHIVE_NAME }}.sha256

      - name: Upload checksum artifact
        uses: actions/upload-artifact@v4
        with:
          name: checksum-${{ steps.suffix.outputs.suffix }}
          path: ${{ env.ARCHIVE_NAME }}.sha256
          retention-days: 1

  checksums:
    needs: build
    runs-on: ubuntu-latest
    name: Publish checksum manifest

    steps:
      - name: Determine tag
        id: tag
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ github.event.inputs.tag }}" >> $GITHUB_OUTPUT
          else
            echo "tag=${{ github.event.release.tag_name }}" >> $GITHUB_OUTPUT
          fi

      - name: Download all checksum artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: checksum-*
          merge-multiple: true
          path: checksums

      - name: Create manifest
        shell: bash
        run: |
          VERSION=${{ steps.tag.outputs.tag }}
          MANIFEST="agentgui-${VERSION}-SHA256SUMS.txt"
          cat checksums/*.sha256 | sort > "$MANIFEST"
          echo "MANIFEST=$MANIFEST" >> $GITHUB_ENV
          echo "Checksum manifest:"
          cat "$MANIFEST"

      - name: Upload manifest to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          files: ${{ env.MANIFEST }}
